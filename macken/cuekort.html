<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuekort · Macken 40 år · Kajskjul 8, hösten 2026</title>
<meta name="description" content="Cuekort för kapellmästare/gitarr – Macken 40 år, Kajskjul 8, Göteborg, hösten 2026.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#000;
    --rule:#8a8a8a;
    --fill:#efefef;
    --paper:#fff;

    /* --- färgkodning per syfte (mörka toner, läsbara i tryck) ---
       Scenen = det jag gör själv · Cue = någon annans signal · Teknik = FOH/Simon */
    --c-song:#15181b;   /* LÅT        – närmast svart, dominerar sidan */
    --c-bpm:#1d4f91;    /* TEMPO      – djupblått */
    --c-omtag:#6a2e8f;  /* OMTAG      – violett */
    --c-byte:#7a4a12;   /* GITARRBYTE – brons */
    --c-cue:#15683f;    /* CUE IN     – gron = kor */
    --c-out:#9c1f2e;    /* CUE UT     – krapplack = sluta */
    --c-sfx:#0b5f6d;    /* LJUD (FOH) – petrol */
    --c-ljus:#8a6a00;   /* LJUS       – ockra */
    --c-mick:#93286b;   /* MICKSPAK   – hallon */
    --c-note:#4a5765;   /* NOTERA     – skiffer */
    --c-todo:#a8500c;   /* ATT LÖSA   – rost */
    --sans: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  /* Monokromt läge – knappen i panelen nollar alla färger till svart */
  body.mono{
    --c-song:var(--ink); --c-bpm:var(--ink); --c-omtag:var(--ink);
    --c-byte:var(--ink); --c-cue:var(--ink);  --c-out:var(--ink);
    --c-sfx:var(--ink);  --c-ljus:var(--ink); --c-mick:var(--ink);
    --c-note:var(--ink); --c-todo:var(--ink);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#d9d9d9; color:var(--ink);
    font-family:var(--sans); font-size:11.5pt; line-height:1.35;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .sheet{
    max-width:198mm; margin:0 auto; background:var(--paper);
    padding:14mm 13mm 18mm;
  }
  /* Läslighet på håll: arket zoomas pa skarm, trycket rör vi inte.
     --z sätts av JS – fyller skärmens bredd vid start, sedan +/- i panelen. */
  @media screen{
    .sheet{ zoom:var(--z, 1); }
  }

  /* ---------- kontrollpanel (bara skärm) ---------- */
  .panel{
    position:sticky; top:0; z-index:9; background:#111; color:#fff;
    padding:10px 14px; display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    font-size:10.5pt;
  }
  .panel strong{font-weight:700; letter-spacing:.02em}
  .panel label{display:flex; gap:6px; align-items:center; cursor:pointer}
  .panel input{accent-color:#fff}
  .panel button{
    font:inherit; font-weight:700; background:#fff; color:#111; border:0;
    padding:6px 14px; cursor:pointer;
  }
  .panel button:focus-visible, .panel label:focus-within{outline:2px solid #fff; outline-offset:2px}
  .zoomctl{display:flex; align-items:center; gap:0}
  .zoomctl button{min-width:38px; font-size:14pt; line-height:1; padding:5px 10px}
  .zoomctl button#zAuto{font-size:10pt; font-weight:700; min-width:auto; padding:6px 10px}
  .panel button.on{background:#2b2b2b; color:#fff; box-shadow:inset 0 0 0 1.5px #fff}
  .zoomctl output{
    min-width:58px; text-align:center; font-family:var(--mono);
    font-size:10pt; font-weight:700; padding:0 6px;
  }

  /* ---------- huvud ---------- */
  .plate{border:2.5px solid var(--ink); padding:7mm 8mm 6mm; margin-bottom:8mm}
  .plate h1{
    margin:0; font-size:30pt; line-height:.95; font-weight:800;
    letter-spacing:-.02em;
  }
  .plate h1 span{display:block; font-size:13pt; font-weight:400; letter-spacing:.34em; margin-bottom:5px}
  .plate .meta{
    margin-top:6mm; padding-top:3mm; border-top:1px solid var(--rule);
    display:flex; flex-wrap:wrap; gap:4mm 10mm;
    font-family:var(--mono); font-size:9pt;
  }
  .plate .meta b{font-weight:700}

  /* ---------- översikt ---------- */
  h2.sec{
    font-size:12pt; font-weight:800; letter-spacing:.18em; margin:0 0 4mm;
    padding-bottom:2mm; border-bottom:2.5px solid var(--ink);
  }
  .over{width:100%; border-collapse:collapse; font-size:9.5pt; margin-bottom:9mm}
  .over th{
    text-align:left; font-family:var(--mono); font-size:8pt; font-weight:700;
    border-bottom:1px solid var(--ink); padding:2px 6px 3px;
  }
  .over td{padding:3px 6px; border-bottom:1px solid #ddd; vertical-align:top}
  .over td:first-child{font-family:var(--mono); font-weight:700; width:12mm}
  .over .brk td{background:var(--fill); font-family:var(--mono); font-size:8.5pt}

  /* ---------- kort ---------- */
  .akt{
    margin:0 0 5mm; padding:2mm 0 2mm;
    border-top:5px solid var(--ink); border-bottom:1.5px solid var(--ink);
    font-size:14pt; font-weight:800; letter-spacing:.2em;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .akt em{font-style:normal; font-family:var(--mono); font-size:8.5pt; font-weight:400; letter-spacing:.06em}

  .card{
    border:2px solid var(--ink); margin:0 0 6mm; break-inside:avoid; page-break-inside:avoid;
  }
  .card > header{
    display:flex; align-items:stretch; border-bottom:2px solid var(--ink);
  }
  .card .num{
    font-family:var(--mono); font-weight:700; font-size:14pt;
    background:var(--ink); color:var(--paper);
    padding:3mm 3.5mm; display:flex; align-items:center; min-width:15mm; justify-content:center;
  }
  .card .head{padding:2.5mm 4mm; flex:1}
  .card .head h3{margin:0; font-size:14pt; font-weight:800; line-height:1.15; letter-spacing:-.01em}
  .card .head .tags{margin-top:1.5mm; font-family:var(--mono); font-size:8pt; display:flex; flex-wrap:wrap; gap:2mm 5mm}
  .body{padding:3mm 4mm 3.5mm}

  .row{
    --k:var(--ink);
    display:flex; gap:3mm; align-items:flex-start;
    padding:1.6mm 0; margin-left:-3mm;
    border-left:3.5px solid var(--k);
  }
  .row + .row{border-top:1px dotted #c4c4c4}
  /* en färg per syfte – samma färg överallt på sidan */
  .row.k-song{--k:var(--c-song)}
  .row.k-cue{--k:var(--c-cue)}
  .row.k-out{--k:var(--c-out)}
  .row.k-omtag{--k:var(--c-omtag)}
  .row.k-note{--k:var(--c-note)}
  .row.k-sfx{--k:var(--c-sfx)}
  .row.k-todo{--k:var(--c-todo)}
  .row.k-ljus{--k:var(--c-ljus)}
  .row.k-byte{--k:var(--c-byte)}
  .row.k-mick{--k:var(--c-mick)}
  /* etiketten ÄR färgkoden – ett fyllt block med ikonen i */
  .lbl{
    flex:0 0 26mm; align-self:flex-start;
    display:flex; align-items:center; gap:1.6mm; white-space:nowrap;
    background:var(--k); color:var(--paper);
    font-family:var(--mono); font-size:7.2pt; font-weight:700;
    letter-spacing:.07em; line-height:1; padding:1.4mm 2mm;
  }
  .lbl .ic{flex:0 0 auto; width:12px; height:12px; color:inherit}
  .lbl .ic svg{display:block; width:12px; height:12px}
  /* monokromt: samma block, men konturat i stället för fyllt – lätt på trycksvärtan */
  body.mono .lbl{
    background:var(--paper); color:var(--ink);
    box-shadow:inset 0 0 0 1.2px var(--ink);
  }
  /* attacca-pilen står utanför blocken */
  .attacca .ic{width:13px; height:13px}
  .txt{flex:1}
  .txt .sub{font-size:9pt; color:#333}

  /* låtrad = det viktigaste */
  .song .txt{font-size:13pt; font-weight:800; line-height:1.2}
  .song .lbl{padding-top:4px}

  /* cue-repliker */
  .say{font-weight:700; font-size:12pt}
  .who{font-weight:400}

  .attacca{
    display:flex; align-items:center; gap:3mm; margin:1.5mm 0 1.5mm 0;
    font-family:var(--mono); font-size:8pt; font-weight:700; letter-spacing:.14em;
  }
  .attacca::after{content:""; flex:1; border-top:1.5px solid var(--ink)}
  .attacca svg{width:13px; height:13px}

  .flag{
    display:inline-block; border:1.5px solid var(--ink); padding:0 4px;
    font-family:var(--mono); font-size:7.5pt; font-weight:700; letter-spacing:.05em;
    margin-right:4px; white-space:nowrap;
  }
  .flag.solid{background:var(--ink); color:var(--paper)}

  .paus{
    display:flex; align-items:center; gap:3mm; margin:0 0 6mm; padding:1.5mm 0;
    border-top:1px dashed var(--ink); border-bottom:1px dashed var(--ink);
    font-family:var(--mono); font-size:9pt; letter-spacing:.05em;
    break-inside:avoid;
  }
  .paus svg{width:16px; height:16px}
  .paus.inkort{margin:2mm 0}
  .paus b{font-weight:700}
  .paus.big{
    background:var(--ink); color:var(--paper); border:0;
    padding:3mm 4mm; font-size:11pt; font-weight:700; letter-spacing:.3em;
  }

  .todolist{border:2px dashed var(--ink); padding:4mm 5mm; margin-top:7mm; break-inside:avoid}
  .todolist h2{margin:0 0 2.5mm; font-size:11pt; letter-spacing:.14em}
  .todolist ul{margin:0; padding-left:5mm; font-size:10pt}
  .todolist li{margin-bottom:1.5mm}
  .todolist li b{font-family:var(--mono); font-size:8.5pt}

  footer.foot{
    margin-top:8mm; padding-top:2mm; border-top:1px solid var(--rule);
    font-family:var(--mono); font-size:8pt; display:flex; justify-content:space-between;
  }

  /* ---------- lägen ---------- */
  body.compact{font-size:10.5pt}
  body.compact .card .head h3{font-size:12pt}
  body.compact .song .txt{font-size:11.5pt}
  body.compact .say{font-size:10.5pt}
  body.compact .body{padding:2mm 3.5mm 2.5mm}
  body.compact .row{padding:1.2mm 0}
  body.compact .card{margin-bottom:4.5mm}
  body.compact .bpm{font-size:11pt}

  /* tempo (alla) + preset/gitarr (kapellmästare/gitarr) */
  .bpm{
    flex:0 0 auto; align-self:center; text-align:center; min-width:16mm;
    border:1.5px solid var(--c-bpm); background:var(--c-bpm); color:var(--paper);
    padding:.8mm 2mm;
    font-family:var(--mono); font-size:13pt; font-weight:700; line-height:1.05;
  }
  .bpm small{display:block; font-size:6.5pt; letter-spacing:.12em; opacity:.8}
  body.mono .bpm{background:var(--paper); color:var(--ink)}
  /* klickbar tempoblinkare – tryck = blinka i låtens BPM, tryck igen = stopp */
  button.bpm{cursor:pointer; margin:0;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  button.bpm:hover{filter:brightness(1.25)}
  button.bpm.on{outline:2px dashed var(--c-bpm); outline-offset:2px}
  /* slaget blinkar genom att vända rutan */
  button.bpm.on.beat{background:var(--paper); color:var(--c-bpm)}
  body.mono button.bpm.on.beat{background:var(--ink); color:var(--paper)}
  /* Richards egna inräkningar – förstärkt rad, större tempo. Andras låtrader rörs inte. */
  .row.inr{
    background:#e8eef7; border-left-width:8px;
    margin-right:-4mm; padding:2.4mm 4mm 2.4mm 0;
    box-shadow:inset 0 0 0 2px var(--c-bpm);
  }
  .row + .row.inr, .row.inr + .row{border-top:0}
  .inrchip{
    display:inline-block; margin:0 0 1.2mm; padding:.8mm 2.2mm;
    background:var(--c-bpm); color:var(--paper);
    font-family:var(--mono); font-size:8.5pt; font-weight:800; letter-spacing:.1em; line-height:1.1;
  }
  .row.inr .bpm{font-size:21pt; min-width:25mm; padding:1.4mm 3mm; border-width:2.5px}
  .row.inr .bpm small{font-size:7pt}
  body.compact .row.inr .bpm{font-size:17pt}
  body.mono .row.inr{background:none; box-shadow:inset 0 0 0 2px var(--ink)}
  body.mono .inrchip{background:var(--ink)}
  .over td.bpms b{background:var(--c-bpm); color:var(--paper); padding:0 3px}
  body.mono .over td.bpms b{background:var(--ink)}
  .pchip{
    display:inline-block; vertical-align:2px; margin-left:2mm; padding:0 4px;
    background:var(--fill); border:1px solid var(--rule);
    font-family:var(--mono); font-size:8pt; font-weight:400; white-space:nowrap;
  }
  .scen{font-family:var(--mono); font-size:8pt; color:#333; margin-top:.5mm}
  .row.byte{background:var(--fill); margin:0 -4mm 0 -3mm; padding-right:4mm}
  .row.byte .txt{font-weight:700}
  .row.byte .sub{font-weight:400}
  /* mickspaken – mickarna upp/ner ur scengolvet */
  /* indrag: spaken hör till raden ovanför, inte en egen post */
  .row.mick{margin-left:9mm; padding-top:1mm; border-left-width:3px}
  .row + .row.mick{border-top:0}
  .row.mick .lbl{flex:0 0 22mm; font-size:6.6pt; padding:1.2mm 1.6mm}
  .mdir{font-weight:800; letter-spacing:.03em}
  .mnr{margin-left:2mm; font-family:var(--mono); font-size:8pt; color:#555}
  .over td.bpms{font-family:var(--mono); font-weight:700; white-space:nowrap; color:var(--c-bpm)}
  .paus .prig{margin-left:auto; font-weight:400; letter-spacing:.04em; font-size:8.5pt; text-align:right}

  /* ---------- färgnyckel ---------- */
  .nyckel{
    display:flex; flex-wrap:wrap; gap:2.5mm 8mm; align-items:baseline;
    margin:0 0 8mm; padding-bottom:3mm; border-bottom:1px solid var(--rule);
    font-family:var(--mono); font-size:7.6pt;
  }
  .nyckel .grp{display:flex; flex-wrap:wrap; gap:1.5mm 4mm; align-items:baseline}
  .nyckel .gn{
    font-weight:700; letter-spacing:.16em; color:#8a8a8a; font-size:6.8pt;
    border-right:1px solid #d0d0d0; padding-right:3mm;
  }
  .nyckel i{
    display:inline-block; font-style:normal; font-weight:700; letter-spacing:.07em;
    background:var(--k); color:var(--paper); padding:1.1mm 1.8mm; line-height:1;
  }
  body.mono .nyckel{display:none}

  body.hide-rig .rigtag{display:none}

  /* ---------- print ---------- */
  @page{size:A4 portrait; margin:11mm}
  /* Lank till kanallistan – klickbar pa skarm, utskriven URL pa papper */
  .xlink{color:inherit; text-decoration:none; border-bottom:1.5px solid var(--ink); font-weight:700}
  .xlink:hover{background:var(--fill)}

  @media print{
    body{background:#fff; font-size:11pt}
    button.bpm, button.bpm.on, button.bpm.on.beat{
      background:var(--c-bpm); color:var(--paper); outline:0}
    body.mono button.bpm, body.mono button.bpm.on, body.mono button.bpm.on.beat{
      background:none; color:var(--ink)}
    .panel{display:none}
    .xlink{border-bottom:0}
    .xlink::after{content:" richardhauer.com/macken/kanallista.html";
      font-family:var(--mono); font-weight:400; font-size:8pt; white-space:nowrap}
    .sheet{max-width:none; padding:0; margin:0}
    .card{border-width:1.6px}
    body.breaks .paus{break-after:page; page-break-after:always}
    body.breaks .paus.big{break-after:auto; page-break-after:auto}
    body.breaks .akt{break-before:page; page-break-before:always}
    body.breaks .akt.first{break-before:auto; page-break-before:auto}
    .todolist{break-before:auto}
  }
</style>
</head>

<div class="panel">
  <strong>Cuekort · Macken 40 år</strong>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<div class="sheet" id="sheet"></div>

<script>
/* =========================================================================
   ALLT INNEHÅLL LIGGER HÄR NERE. Ändra bara i SHOW-arrayen.
   kind: 'song' | 'cue' | 'out' | 'omtag' | 'note' | 'sfx' | 'todo' | 'ljus' | 'attacca' | 'byte' | 'mick' | 'paus'
   paus (inne i ett kort): paus mitt i kortet utan att korten numreras om
   cue/out: svar:{who,text} = replik direkt efter, i samma storlek som cuen
   cue/out: fri:true = texten är en handling, inte en replik (inga citattecken)
   mick: mickspaken – nr (Niklas lista 16 sep 2026), dir: 'upp' | 'ner'
   song: bpm (visas för alla) · preset, git (nyckel i GIT), scen, tyst (bara med "Visa gitarr/preset")
   byte: gitarrbyte – hela raden döljs med "Visa gitarr/preset"
   ========================================================================= */

/* Gitarrer och Axe-FX-ingångar – ur GUITARTECH/macken-axefx-presets.md (16 sep 2026) */
const GIT = {
  narvik:{namn:"Narvik",     in:"In 1"},
  stal:  {namn:"Stålsträngad", in:"In 3 R"},
  banjo: {namn:"Banjo",      in:"In 3 L"}
};

const SHOW = [
 {akt:2, len:"ca 1 tim 40 min"},

 {card:"1", title:"Ouvertyr → Macken piano → Macken gitarr",
  items:[
    {kind:"note", text:"Hela kvällen: sjung med mer på allt ni kan", sub:"Speciellt på Husvagn och Kärlek är större än bilar"},
    {kind:"ljus", text:"Tummen upp till ljud & ljus när bandet är redo på scen"},
    {kind:"sfx", text:"FOH: speakerinspelning från bandet startar föreställningen"},
    {kind:"note", text:"Bort med synten på ”gjort”", sub:"Speakern: ”om inte vi gör det blir det inte gjort”"},

/* ---------- rendering ---------- */
const IC = {
  cue:"i-cue", out:"i-out", omtag:"i-repeat", note:"i-note",
  sfx:"i-sfx", todo:"i-q", ljus:"i-bulb", song:"i-note", byte:"i-swap", mick:"i-lift"
};
const LBL = {
  cue:"CUE IN", out:"CUE UT", omtag:"OMTAG", note:"NOTERA",
  sfx:"LJUD", todo:"ATT LÖSA", ljus:"LJUS", song:"LÅT", byte:"GITARRBYTE", mick:"MICKSPAK"
};
/* färgnyckel – samma nycklar som LBL, grupperade efter vem som agerar */
const FARG = [
  ["SCENEN", [["song","LÅT"],["bpm","TEMPO"],["omtag","OMTAG"],["byte","GITARRBYTE"]]],
  ["CUE",    [["cue","CUE IN"],["out","CUE UT"]]],
  ["TEKNIK", [["sfx","LJUD"],["ljus","LJUS"],["mick","MICKSPAK"]]],
  ["EGET",   [["note","NOTERA"],["todo","ATT LÖSA"]]]
];
const icon = id => `<span class="ic"><svg viewBox="0 0 24 24"><use href="#${id}"/></svg></span>`;
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderItem(it){
  if(it.kind === "attacca")
    return `<div class="attacca">${icon("i-arrow")}ATTACCA – ingen paus</div>`;
  if(it.kind === "paus")
    return `<div class="paus inkort">${icon("i-wrench")}<b>${esc(it.text)}</b></div>`;

  const bas = it.kind === "song" ? (it.inr ? "row song inr" : "row song") : it.kind === "byte" ? "row byte rigtag" : it.kind === "mick" ? "row mick" : "row";
  const cls = `${bas} k-${it.kind}`;
  let txt;
  if(it.kind === "cue" || it.kind === "out"){
    txt = `${it.who?`<span class="who">${esc(it.who)}:</span> `:""}<span class="say">${it.fri ? esc(it.text) : `”${esc(it.text)}”`}</span>`;
    if(it.svar) txt += `<div>${it.svar.who?`<span class="who">${esc(it.svar.who)}:</span> `:""}<span class="say">”${esc(it.svar.text)}”</span></div>`;
  } else if(it.kind === "mick"){
    txt = `<span class="mdir">${it.dir === "upp" ? "▲ Mickar UPP" : "▼ Mickar NER"}</span> · ${esc(it.text)}<span class="mnr">#${it.nr}</span>`;
  } else {
    txt = esc(it.text);
  }
  if(it.flag) txt = `<span class="flag">${esc(it.flag)}</span>` + txt;
  if(it.inr) txt = `<div><span class="inrchip">▶ RICHARD RÄKNAR IN${it.inr === true ? "" : " · " + esc(it.inr)}</span></div>` + txt;
  if(it.preset){
    const g = GIT[it.git];
    txt += `<span class="pchip rigtag">${esc(it.preset)} · ${it.tyst ? "tyst" : esc(g.namn)}</span>`;
  }
  if(it.sub)  txt += `<div class="sub">${esc(it.sub)}</div>`;
  if(it.scen) txt += `<div class="scen rigtag">Scen: ${esc(it.scen)}</div>`;
  const bpm = it.bpm ? `<button type="button" class="bpm" data-bpm="${it.bpm}" aria-pressed="false" title="Tryck för att blinka i ${it.bpm} BPM"><small>BPM</small>${it.bpm}</button>` : "";

  return `<div class="${cls}">
    <div class="lbl">${icon(IC[it.kind])}${LBL[it.kind]}</div>
    <div class="txt">${txt}</div>${bpm}</div>`;
}

function renderCard(b, akt){
  const gits = [...new Set(b.items.filter(i=>i.git).map(i=>i.git))]
    .map(k=>`${GIT[k].namn} · ${GIT[k].in}`);
  const tags = [...gits, ...(b.tags||[])].map(t=>`<span class="rigtag">${esc(t)}</span>`).join("");
  return `<section class="card">
    <header>
      <div class="num">${akt}:${b._n}</div>
      <div class="head"><h3>${esc(b.title)}</h3>${tags?`<div class="tags">${tags}</div>`:""}</div>
    </header>
    <div class="body">${b.items.map(renderItem).join("")}</div>
  </section>`;
}

function build(){
  // numrera korten automatiskt per akt – flytta ett kort, numren följer med
  let n = 0;
  SHOW.forEach(b=>{ if(b.akt){ n = 0; } else if(!b.paus){ b._n = ++n; } });

  let html = `<div class="plate">
      <h1><span>KAJSKJUL 8</span>Macken 40 år</h1>
      <div class="meta">
        <div><b>Cuekort</b> – kapellmästare/gitarr</div>
        <div><b>Attacca</b> = håll ihop, ingen paus</div>
        <div><b>Akt 2</b> ca 1 tim 40 min</div>
        <div><b>Ljud</b> = FOH kör alla ljud-cuer och tracks</div>
        <div><b>BPM</b> = tempot på låten</div>
        <div><b>▶ Blå ram</b> = Richard räknar in (▶ i översikten)</div>
        <div><b>Mickspak</b> = mickarna upp/ner ur scengolvet – Simon sköter spaken från keyboardplats · tajmas exakt på rep</div>
        <div class="rigtag"><b>Axe-FX III</b> MIDI-kanal 14 · grå ruta = preset</div>
        <div><a class="xlink" href="kanallista.html">Kanallista &amp; monitorlista &rarr;</a></div>
      </div>
    </div>`;

  // färgnyckel
  html += `<div class="nyckel">` + FARG.map(([g, rader]) =>
      `<span class="grp"><span class="gn">${g}</span>` + rader.map(([k, namn]) =>
        `<i style="--k:var(--c-${k})">${namn}</i>`).join("") + `</span>`
    ).join("") + `</div>`;

  // översikt
  html += `<h2 class="sec">SNABBÖVERSIKT</h2><table class="over"><thead>
    <tr><th>Nr</th><th>Innehåll</th><th>BPM</th><th>Cue in</th></tr></thead><tbody>`;
  let akt = 1;
  SHOW.forEach(b=>{
    if(b.akt){ akt = b.akt;
      html += `<tr class="brk"><td colspan="4">AKT ${b.akt}</td></tr>`; return; }
    if(b.paus){ html += `<tr class="brk"><td></td><td colspan="3">${esc(b.paus)}</td></tr>`; return; }
    const c = b.items.find(i=>i.kind==="cue");
    const cue = c ? `${c.who?c.who+": ":""}”${c.text}”` : (b.items.find(i=>i.kind==="todo") ? "cue ej klar" : "–");
    const bpms = b.items.filter(i=>i.kind==="song").map(i=>i.inr && i.bpm ? `<b>▶${i.bpm}</b>` : (i.bpm||"–")).join(" · ");
    html += `<tr><td>${akt}:${b._n}</td><td>${esc(b.title)}</td><td class="bpms">${bpms}</td><td>${esc(cue)}</td></tr>`;
  });
  html += `</tbody></table>`;

  // kort
  akt = 1; let first = true;
  SHOW.forEach(b=>{
    if(b.akt){
      akt = b.akt;
      html += `<div class="akt${first?" first":""}">AKT ${b.akt}<em>${esc(b.len||"")}</em></div>`;
      first = false; return;
    }
    if(b.paus){
      const big = /^AKTPAUS/.test(b.paus);
      const prig = b.preset ? `<span class="prig rigtag">${esc(b.preset)} tyst${b.byte ? " · " + esc(b.byte) : ""}</span>` : "";
      html += `<div class="paus${big?" big":""}">${icon(big?"i-bulb":"i-wrench")}<b>${esc(b.paus)}</b>${prig}</div>`; return;
    }
    html += renderCard(b, akt);
  });

  // att lösa
  const todos = [];
  akt = 1;
  SHOW.forEach(b=>{
    if(b.akt){ akt = b.akt; return; }
    if(b.paus) return;
    b.items.filter(i=>i.kind==="todo").forEach(i=>todos.push(`<li><b>${akt}:${b._n}</b> ${esc(b.title)} – ${esc(i.text)}</li>`));
  });
  if(todos.length) html += `<div class="todolist"><h2>ATT LÖSA FÖRE PREMIÄR</h2><ul>${todos.join("")}
    </ul></div>`;

  html += `<footer class="foot"><span>Macken 40 år – cuekort · tempo (klickbart) + presets + mickspak 16 sep · inräkningar 24 sep 2026</span><span>Utskrift: <span id="d"></span></span></footer>`;

  document.getElementById("sheet").innerHTML = html;
  document.getElementById("d").textContent = new Date().toLocaleDateString("sv-SE");
}
build();

const t = (id, cls, inv) => {
  const el = document.getElementById(id);
  el.addEventListener("change", () => document.body.classList.toggle(cls, inv ? !el.checked : el.checked));
};
t("tBreaks","breaks");

/* klickljud – Web Audio, tidsatt mot ljudklockan så att klicket ligger på slaget */
const tClick = document.getElementById("tClick");
try { if(localStorage.getItem("cuekort-klick") === "av") tClick.checked = false; } catch(e){}
tClick.addEventListener("change", () => {
  try { localStorage.setItem("cuekort-klick", tClick.checked ? "pa" : "av"); } catch(e){}
});
let actx = null;
function audio(){
  // skapas/väcks i klickhändelsen – annars tystar iOS och Chrome ljudet
  try {
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
  } catch(e){ actx = null; }
  return actx;
}
function klick(when){
  if(!tClick.checked || !actx) return;
  const at = Math.max(when, actx.currentTime);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "square"; o.frequency.value = 1500;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.5, at + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
  o.connect(g).connect(actx.destination);
  o.start(at); o.stop(at + 0.05);
}
function stopBlink(){
  if(!blink) return;
  clearTimeout(blink.timer);
  blink.el.classList.remove("on","beat");
  blink.el.setAttribute("aria-pressed","false");
  blink = null;
}
function startBlink(el){
  const ms = 60000 / Number(el.dataset.bpm);
  const t0 = performance.now();
  const a = audio();
  const a0 = a ? a.currentTime : 0;
  let n = 0;
  el.classList.add("on");
  el.setAttribute("aria-pressed","true");
  blink = {el, timer:0};
  const tick = () => {
    el.classList.add("beat");
    klick(a0 + n * ms / 1000);
    setTimeout(() => el.classList.remove("beat"), Math.min(120, ms / 3));
    n++;
    // räkna från starttiden så att tempot inte driver
    blink.timer = setTimeout(tick, Math.max(0, t0 + n * ms - performance.now()));
  };
  tick();
}
document.getElementById("sheet").addEventListener("click", e => {
  const el = e.target.closest("button.bpm");
  if(!el) return;
  const same = blink && blink.el === el;
  stopBlink();
  if(!same) startBlink(el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape") stopBlink(); });

/* ---------- zoom (bara skärm) ---------- */
const ZKEY = "cuekort-zoom";
const zVal = document.getElementById("zVal");
let z = 1, egenZoom = false;

/* utan sparat val: fyll skärmens bredd – 198mm ark ~ 748 CSS-px */
function passaBredden(){
  const arkPx = 198 * 96 / 25.4;
  return Math.max(1, Math.min(1.8, Math.round((window.innerWidth - 14) / arkPx * 20) / 20));
}
const zAuto = document.getElementById("zAuto");
function markera(){
  zAuto.classList.toggle("on", !egenZoom);
  zAuto.setAttribute("aria-pressed", egenZoom ? "false" : "true");
}
function setZoom(v, spara){
  z = Math.max(0.8, Math.min(2.2, Math.round(v * 20) / 20));
  document.documentElement.style.setProperty("--z", z);
  zVal.textContent = Math.round(z * 100) + " %";
  if(spara){ egenZoom = true; try { localStorage.setItem(ZKEY, z); } catch(e){} }
  markera();
}
/* Auto = glöm det egna valet och fyll bredden igen */
function auto(){
  egenZoom = false;
  try { localStorage.removeItem(ZKEY); } catch(e){}
  setZoom(passaBredden(), false);   // spara=false rör inte egenZoom
}
try {
  const sparad = parseFloat(localStorage.getItem(ZKEY));
  if(sparad > 0){ egenZoom = true; setZoom(sparad, false); }
} catch(e){}
if(!egenZoom) auto();

document.getElementById("zMinus").addEventListener("click", () => setZoom(z - 0.1, true));
document.getElementById("zPlus").addEventListener("click", () => setZoom(z + 0.1, true));
zAuto.addEventListener("click", auto);
/* har han inte valt själv får vändning av plattan räkna om */
window.addEventListener("resize", () => { if(!egenZoom) setZoom(passaBredden(), false); });

/* ---------- monokromt läge ---------- */
const btnMono = document.getElementById("btnMono");
function setMono(pa){
  document.body.classList.toggle("mono", pa);
  btnMono.textContent = pa ? "Färgkodat" : "Monokrom";
  btnMono.setAttribute("aria-pressed", pa ? "true" : "false");
  try { localStorage.setItem("cuekort-mono", pa ? "pa" : "av"); } catch(e){}
}
try { if(localStorage.getItem("cuekort-mono") === "pa") setMono(true); } catch(e){}
btnMono.addEventListener("click", () => setMono(!document.body.classList.contains("mono")));

document.getElementById("btnPrint").addEventListener("click", () => window.print());
